<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Socket Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
    }

    header {
      padding: 16px;
      background: #2563eb;
      color: #ffffff;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px;
      background: #e4e6eb;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .message.own {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
    }

    .message .user {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #dddfe2;
      background: #ffffff;
    }

    #input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccd0d5;
      border-radius: 20px;
      outline: none;
    }

    #input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Live Socket Chat</h1>
    </header>

    <div id="messages"></div>

    <form id="form">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" maxlength="500" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat-message', text);
      input.value = '';
      input.focus();
    });

    socket.on('chat-message', (msg) => {
      const item = document.createElement('div');
      item.className = 'message' + (msg.senderSocketId === socket.id ? ' own' : '');

      const user = document.createElement('span');
      user.className = 'user';
      user.textContent = msg.senderSocketId === socket.id ? 'You (' + msg.id + ')' : 'User ' + msg.id;

      const text = document.createElement('span');
      text.textContent = msg.text;

      item.appendChild(user);
      item.appendChild(text);
      messages.appendChild(item);

      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
