<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <title>Atti chat</title>
  <script>
    /* Apply the saved theme before first paint so there is no flash */
    (function () {
      try { if (localStorage.getItem('atti-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ---------- design tokens (dark theme) ---------- */
    :root {
      --bg: #000000;
      --panel: #000000;
      --text: #f4f1f6;
      --muted: #8f8799;
      --border: #1d1d1d;
      --field: #101010;
      --accent: #d9436f;
      --accent-hover: #ec5a85;
      --bubble: #181818;
      --bubble-own: #d9436f;
      --on-accent: #ffffff;
      --online: #3ddc84;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --danger-text: #ff9aa8;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      --pop-shadow: 0 10px 28px rgba(0, 0, 0, 0.85);
      --menu-bg: #0a0a0a;
      --scrim: rgba(0, 0, 0, 0.72);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* ---------- light theme ---------- */
    :root[data-theme="light"] {
      --bg: #f5eff7;
      --panel: #fffcfd;
      --text: #2b2233;
      --muted: #7f7290;
      --border: #efe5f3;
      --field: #f7f1f9;
      --accent: #dd4a76;
      --accent-hover: #cf3a67;
      --bubble: #f1e8f6;
      --bubble-own: #dd4a76;
      --danger-bg: rgba(221, 74, 118, 0.1);
      --danger-text: #c2305a;
      --shadow: 0 24px 60px rgba(132, 92, 160, 0.18);
      --pop-shadow: 0 10px 28px rgba(132, 92, 160, 0.22);
      --menu-bg: #ffffff;
      --scrim: rgba(60, 40, 80, 0.32);
    }
    :root[data-theme="light"] body {
      background:
        radial-gradient(900px 520px at 10% -10%, #ffe2ec 0%, transparent 62%),
        radial-gradient(820px 560px at 105% 110%, #e5dfff 0%, transparent 62%),
        var(--bg);
      background-attachment: fixed;
    }
    :root[data-theme="light"] .app { box-shadow: var(--shadow); }
    :root[data-theme="light"] input:focus { box-shadow: 0 0 0 4px rgba(221, 74, 118, 0.15); }

    /* ---------- keep the layout fixed while the mobile keyboard is open ---------- */
    html, body { overflow: hidden; overscroll-behavior: none; }
    #chat-view {
      top: var(--vv-top, 0px);
      bottom: auto;
      height: var(--vv-h, 100%);
    }

    /* ---------- options menu ---------- */
    .menu-wrap { position: relative; }
    .menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 15;
      min-width: 232px;
      padding: 8px;
      border-radius: 20px;
      background: var(--menu-bg);
      border: 1px solid var(--border);
      box-shadow: var(--pop-shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.94);
      transform-origin: top right;
      transition: opacity 0.25s ease, transform 0.4s var(--spring), visibility 0.25s;
    }
    .menu.open { opacity: 1; visibility: visible; transform: none; }
    .menu-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 8px 10px 12px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .menu-user-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; font-weight: 700; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      text-align: left;
      transition: background-color 0.2s ease, transform 0.25s var(--spring);
    }
    .menu-item:hover { background: var(--field); }
    .menu-item:active { transform: scale(0.98); }
    .menu-item svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .menu-item.danger { color: var(--danger-text); }
    .menu-item.danger:hover { background: var(--danger-bg); }
    .menu-item .i-moon { display: none; }
    :root[data-theme="light"] .menu-item .i-moon { display: block; }
    :root[data-theme="light"] .menu-item .i-sun { display: none; }
    .menu-credit { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); text-align: center; font-size: 0.7rem; color: var(--muted); }
    .menu-credit b { font-weight: 600; color: var(--text); }

    /* ---------- change DP sheet ---------- */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--scrim);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
    }
    .sheet-backdrop.open { opacity: 1; visibility: visible; }
    .sheet {
      width: 100%;
      max-width: 380px;
      padding: 22px 20px 18px;
      border-radius: 26px;
      background: var(--menu-bg);
      border: 1px solid var(--border);
      box-shadow: var(--pop-shadow);
      transform: translateY(24px) scale(0.95);
      transition: transform 0.5s var(--spring);
    }
    .sheet-backdrop.open .sheet { transform: none; }
    .sheet h3 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
    .sheet-sub { margin: 0 0 16px; color: var(--muted); font-size: 0.85rem; }
    .dp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
    .dp-opt {
      aspect-ratio: 1;
      padding: 0;
      border-radius: 16px;
      background: var(--field);
      transition: transform 0.3s var(--spring), box-shadow 0.25s ease;
    }
    .dp-opt svg { display: block; width: 100%; height: 100%; }
    .dp-opt:hover { transform: scale(1.08); }
    .dp-opt:active { transform: scale(0.92); }
    .dp-opt.selected { box-shadow: 0 0 0 3px var(--menu-bg), 0 0 0 5px var(--accent); transform: scale(1.04); }
    .sheet .form-error { margin-bottom: 12px; }
    .sheet-actions { display: flex; gap: 10px; }
    .sheet-actions button { flex: 1; }
    .ghost {
      padding: 13px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 999px;
      background: var(--field);
      color: var(--text);
      transition: transform 0.25s var(--spring), background-color 0.25s ease;
    }
    .ghost:hover { background: var(--bubble); }
    .ghost:active { transform: scale(0.96); }
    .avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* compact header on small phones so the title and credit both fit */
    @media (max-width: 420px) {
      header { padding: 10px 10px; gap: 6px; }
      header .logo { width: 36px; height: 36px; border-radius: 12px; }
      header .logo svg { width: 20px; height: 20px; }
      .brand { gap: 8px; }
      .brand-text h2 { font-size: 1.15rem; }
      .header-right { gap: 6px; }
      .pill { padding: 6px 9px; gap: 6px; font-size: 0.72rem; }
      .icon-btn { width: 40px; height: 40px; }
    }
    @media (max-width: 400px) { .me { display: none; } }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- shared: buttons, focus, ripple ---------- */
    button, .btn {
      font-family: inherit;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    button:focus-visible,
    .btn:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent-hover);
      outline-offset: 2px;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      transform: scale(0);
      pointer-events: none;
      animation: ripple 0.6s var(--ease) forwards;
    }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .primary {
      padding: 13px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      transition: transform 0.25s var(--spring), background-color 0.25s ease, box-shadow 0.3s ease, opacity 0.25s ease;
    }
    .primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(217, 67, 111, 0.4);
    }
    .primary:active:not(:disabled) { transform: translateY(0) scale(0.96); box-shadow: none; }
    .primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .primary.loading:disabled { opacity: 1; cursor: progress; color: transparent; }
    .primary.loading::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--field);
      color: var(--text);
      transition: transform 0.3s var(--spring), background-color 0.25s ease;
    }
    .icon-btn:hover { background: var(--bubble); transform: scale(1.1); }
    .icon-btn:active { transform: scale(0.88); }
    .icon-btn svg { width: 20px; height: 20px; display: block; }

    .logo {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #ffffff;
      transition: transform 0.5s var(--spring);
    }
    .logo:hover { transform: rotate(-8deg) scale(1.08); }
    .logo svg { width: 24px; height: 24px; }

    .credit { font-size: 0.7rem; color: var(--muted); }
    .credit b { font-weight: 600; color: var(--text); }

    /* ---------- views (auth / chat) ---------- */
    .view {
      position: fixed;
      inset: 0;
      z-index: 10;
      transition: opacity 0.5s var(--ease), visibility 0.5s;
    }
    .view.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: var(--bg);
      transition: opacity 0.5s var(--ease), visibility 0.5s;
    }
    #splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .logo { width: 56px; height: 56px; border-radius: 18px; animation: breathe 1.4s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    /* ---------- auth view ---------- */
    #auth-view { display: flex; overflow-y: auto; padding: 20px; }

    .auth-card {
      width: 100%;
      max-width: 410px;
      margin: auto;
      padding: 32px 28px 24px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.7s var(--spring);
    }
    #auth-view.hidden .auth-card { transform: translateY(26px) scale(0.96); }

    .auth-head { text-align: center; margin-bottom: 22px; }
    .auth-head .logo { width: 58px; height: 58px; border-radius: 19px; margin: 0 auto 14px; }
    .auth-head .logo svg { width: 32px; height: 32px; }
    .auth-head h1 { margin: 0 0 6px; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; }
    .auth-head p { margin: 0; color: var(--muted); font-size: 0.92rem; }

    .tabs {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: var(--field);
    }
    .tab-ind {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      border-radius: 999px;
      background: var(--accent);
      transition: transform 0.45s var(--spring);
    }
    .tabs[data-mode="signup"] .tab-ind { transform: translateX(100%); }
    .tab {
      position: relative;
      z-index: 1;
      padding: 10px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: #ffffff; }

    .form-error {
      display: none;
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--danger-bg);
      color: var(--danger-text);
      font-size: 0.85rem;
      font-weight: 500;
    }
    .form-error.show { display: block; animation: shake 0.45s var(--ease); }
    @keyframes shake {
      0% { opacity: 0; transform: translateX(0); }
      20% { opacity: 1; transform: translateX(-7px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(2px); }
      100% { transform: none; }
    }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-width: 0;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 16px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--field);
      color: var(--text);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.35s ease, background-color 0.3s ease;
    }
    input::placeholder { color: var(--muted); opacity: 0.8; transition: opacity 0.3s ease; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(217, 67, 111, 0.18); }
    input:focus::placeholder { opacity: 0.4; }
    input:disabled { opacity: 0.6; }

    /* display-name field that slides open in sign-up mode */
    .collapse {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 0.45s var(--ease), opacity 0.35s ease, visibility 0s linear 0.45s;
    }
    .collapse.open {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }
    .collapse > div { overflow: hidden; padding: 6px; margin: -6px; }

    .pw { position: relative; }
    .pw input { padding-right: 52px; }
    .pw-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      transition: color 0.25s ease, background-color 0.25s ease;
    }
    .pw-toggle:hover { color: var(--text); background: var(--bubble); }
    .pw-toggle svg { width: 20px; height: 20px; }
    .pw-toggle .off { display: none; }
    .pw-toggle.on .eye { display: none; }
    .pw-toggle.on .off { display: block; }

    .submit { width: 100%; margin-top: 4px; padding: 14px 22px; }

    .auth-card .credit { margin-top: 20px; text-align: center; }

    /* ---------- chat view ---------- */
    #chat-view { display: flex; justify-content: center; }

    @media (min-width: 800px) {
      #chat-view { padding: 24px; }
    }

    .app {
      flex: 1;
      max-width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
      transition: transform 0.7s var(--spring);
    }
    @media (min-width: 800px) {
      .app { border-radius: 26px; border: 1px solid var(--border); }
    }
    #chat-view.hidden .app { transform: translateY(20px) scale(0.985); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-text { min-width: 0; }
    .brand-text h2 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    .brand-text .credit { margin-top: 3px; }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--field);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill.bump { animation: bump 0.45s var(--spring); }
    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; position: relative; transition: background-color 0.4s ease; }
    .dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      animation: pulse 2s ease-out infinite;
    }
    .dot.online { background: var(--online); }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    .me { display: flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border-radius: 999px; background: var(--field); }
    .me .avatar { width: 30px; height: 30px; flex-basis: 30px; border-radius: 50%; font-size: 0.8rem; }
    .me-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.82rem; font-weight: 600; }
    @media (max-width: 600px) {
      .me { padding: 3px; }
      .me-name { display: none; }
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    .empty { margin: auto; text-align: center; color: var(--muted); font-size: 0.92rem; animation: fadeIn 0.8s var(--ease) both; }
    .empty strong { display: block; margin-bottom: 4px; font-size: 1.1rem; font-weight: 700; color: var(--text); }

    .row { display: flex; align-items: flex-end; gap: 8px; margin-top: 12px; }
    .row.grouped { margin-top: 2px; }
    .row.own { flex-direction: row-reverse; }

    .row.enter .bubble { animation: bubbleIn 0.45s var(--spring) both; transform-origin: bottom left; }
    .row.own.enter .bubble { transform-origin: bottom right; }
    .row.enter .avatar:not(.hidden) { animation: avatarIn 0.5s var(--spring) both; }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(14px) scale(0.85); }
      to { opacity: 1; transform: none; }
    }
    @keyframes avatarIn {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: none; }
    }

    .avatar {
      position: relative;
      overflow: hidden;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .avatar.hidden { visibility: hidden; }

    .bubble {
      max-width: 76%;
      padding: 9px 14px;
      border-radius: 18px 18px 18px 6px;
      background: var(--bubble);
      line-height: 1.45;
      font-size: 0.94rem;
      overflow-wrap: anywhere;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .row.own .bubble { background: var(--bubble-own); color: var(--on-accent); border-radius: 18px 18px 6px 18px; }
    .row.grouped:not(.own) .bubble { border-top-left-radius: 6px; }
    .row.own.grouped .bubble { border-radius: 18px 6px 6px 18px; }

    .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; font-size: 0.74rem; }
    .meta .name { font-weight: 700; }
    .meta .time { opacity: 0.6; font-size: 0.68rem; }

    .system {
      align-self: center;
      margin: 12px 0 4px;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--field);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      animation: systemIn 0.5s var(--ease) both;
    }
    @keyframes systemIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.92); }
      to { opacity: 1; transform: none; }
    }

    #jump {
      position: absolute;
      left: 50%;
      bottom: 138px;
      padding: 9px 18px;
      font-size: 0.85rem;
      box-shadow: var(--pop-shadow);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, 16px) scale(0.9);
      transition: opacity 0.3s ease, transform 0.45s var(--spring), visibility 0.3s, background-color 0.25s ease;
    }
    #jump.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
    #jump.show:hover:not(:disabled) { transform: translate(-50%, -2px) scale(1.03); }
    #jump.show:active:not(:disabled) { transform: translate(-50%, 0) scale(0.95); }

    #typing {
      height: 24px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.4s var(--ease);
    }
    #typing.show { opacity: 1; transform: none; }
    .dots { display: inline-flex; gap: 3px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-hover); animation: hop 1.1s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes hop {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    #emoji-bar {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      margin: 0 12px;
      padding: 0 8px;
      border-radius: 18px;
      background: var(--field);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(10px);
      transition: max-height 0.45s var(--ease), opacity 0.3s ease, transform 0.45s var(--ease), padding 0.45s var(--ease), margin 0.45s var(--ease);
    }
    #emoji-bar.open { max-height: 130px; opacity: 1; transform: none; padding: 8px; margin-bottom: 8px; }
    #emoji-bar button {
      padding: 6px 0;
      font-size: 1.4rem;
      line-height: 1;
      background: transparent;
      border-radius: 12px;
      opacity: 0;
      transform: scale(0.4);
      transition: transform 0.35s var(--spring), opacity 0.25s ease, background-color 0.2s ease;
    }
    #emoji-bar.open button { opacity: 1; transform: none; transition-delay: calc(var(--i) * 18ms), calc(var(--i) * 18ms), 0s; }
    #emoji-bar.open button:hover { background: var(--bubble); transform: scale(1.3); transition-delay: 0s; }
    #emoji-bar.open button:active { transform: scale(0.8); transition-delay: 0s; }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
    }
    .composer input[type="text"] { flex: 1; border-radius: 999px; }

    #send { width: 48px; height: 48px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
    #send svg { width: 22px; height: 22px; transition: transform 0.35s var(--spring); }
    #send:hover:not(:disabled) svg { transform: translate(2px, -2px) rotate(8deg); }
    #send.fly svg { animation: fly 0.6s var(--ease); }
    @keyframes fly {
      0% { transform: none; opacity: 1; }
      45% { transform: translate(26px, -26px) scale(0.6); opacity: 0; }
      46% { transform: translate(-26px, 26px) scale(0.6); opacity: 0; }
      100% { transform: none; opacity: 1; }
    }

    #limit-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 82px;
      margin: 0 auto;
      width: max-content;
      max-width: 90%;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--text);
      color: var(--panel);
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.4s var(--spring);
    }
    #limit-note.show { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <!-- Shown for a moment while we check whether the user is already logged in -->
  <div id="splash">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.6"/></svg>
    </div>
  </div>

  <!-- ================= LOGIN / SIGN UP ================= -->
  <main id="auth-view" class="view hidden">
    <section class="auth-card">
      <div class="auth-head">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.6"/></svg>
        </div>
        <h1>Atti chat</h1>
        <p id="auth-sub">Welcome back. Log in to join the room.</p>
      </div>

      <div class="tabs" id="tabs" data-mode="login" role="tablist">
        <span class="tab-ind"></span>
        <button type="button" class="tab active" data-mode="login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="tab" data-mode="signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <div class="form-error" id="form-error" role="alert"></div>

      <form id="auth-form" novalidate>
        <div class="collapse" id="name-collapse">
          <div>
            <div class="field">
              <label for="display-input">Display name</label>
              <input id="display-input" type="text" maxlength="30" autocomplete="nickname" placeholder="How others will see you" />
            </div>
          </div>
        </div>

        <div class="field">
          <label for="username-input">Username</label>
          <input id="username-input" type="text" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Letters, numbers, underscores" />
        </div>

        <div class="field">
          <label for="password-input">Password</label>
          <div class="pw">
            <input id="password-input" type="password" maxlength="72" autocomplete="current-password" placeholder="Your password" />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>

        <button class="primary submit" id="auth-submit" type="submit">Log in</button>
      </form>

      <div class="credit">developed by <b>Madhesh</b></div>
    </section>
  </main>

  <!-- ================= CHAT ROOM ================= -->
  <div id="chat-view" class="view hidden">
    <div class="app">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.6"/></svg>
          </div>
          <div class="brand-text">
            <h2>Atti chat</h2>
            <div class="credit">developed by <b>Madhesh</b></div>
          </div>
        </div>

        <div class="header-right">
          <div class="pill" id="pill">
            <span class="dot" id="dot"></span>
            <span id="status-text">Connecting...</span>
          </div>
          <div class="me" id="me">
            <span id="me-avatar"></span>
            <span class="me-name" id="me-name"></span>
          </div>
          <div class="menu-wrap">
            <button class="icon-btn" id="menu-btn" type="button" aria-label="Options" title="Options" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="menu" id="menu" role="menu" aria-hidden="true">
              <div class="menu-user"><span id="menu-avatar"></span><span class="menu-user-name" id="menu-name"></span></div>
              <button class="menu-item" id="dp-btn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                Change DP
              </button>
              <button class="menu-item" id="theme-btn" type="button" role="menuitem">
                <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <span id="theme-label">Light mode</span>
              </button>
              <button class="menu-item danger" id="logout-btn" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Log out
              </button>
              <div class="menu-credit">developed by <b>Madhesh</b></div>
            </div>
          </div>
        </div>
      </header>

      <div id="messages"></div>

      <button class="primary" id="jump" type="button">New messages ↓</button>
      <div id="limit-note">Slow down a little. Too many messages at once.</div>

      <div id="typing"><span class="dots"><i></i><i></i><i></i></span><span id="typing-text"></span></div>

      <div id="emoji-bar"></div>

      <form class="composer" id="form">
        <button class="icon-btn" id="emoji-btn" type="button" aria-label="Open emoji picker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 14.5a4.6 4.6 0 0 0 8 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.8"/></svg>
        </button>
        <input id="input" type="text" placeholder="Write a message" autocomplete="off" maxlength="500" disabled />
        <button class="primary" id="send" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>

      <div class="sheet-backdrop" id="dp-modal" aria-hidden="true">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dp-title">
          <h3 id="dp-title">Choose your avatar</h3>
          <p class="sheet-sub">Pick one of 10. Everyone in the room will see it.</p>
          <div class="dp-grid" id="dp-grid"></div>
          <div class="form-error" id="dp-error" role="alert"></div>
          <div class="sheet-actions">
            <button type="button" class="ghost" id="dp-cancel">Cancel</button>
            <button type="button" class="primary" id="dp-save" disabled>Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      'use strict';

      /* ---------- element references ---------- */
      const $ = (id) => document.getElementById(id);

      const splash = $('splash');
      const authView = $('auth-view');
      const chatView = $('chat-view');

      const tabs = $('tabs');
      const tabButtons = Array.from(tabs.querySelectorAll('.tab'));
      const authSub = $('auth-sub');
      const authForm = $('auth-form');
      const formError = $('form-error');
      const nameCollapse = $('name-collapse');
      const displayInput = $('display-input');
      const usernameInput = $('username-input');
      const passwordInput = $('password-input');
      const pwToggle = $('pw-toggle');
      const submitBtn = $('auth-submit');

      const messagesEl = $('messages');
      const form = $('form');
      const input = $('input');
      const sendBtn = $('send');
      const jumpBtn = $('jump');
      const typingEl = $('typing');
      const typingText = $('typing-text');
      const emojiBar = $('emoji-bar');
      const emojiBtn = $('emoji-btn');
      const limitNote = $('limit-note');
      const pill = $('pill');
      const dot = $('dot');
      const statusText = $('status-text');
      const meAvatar = $('me-avatar');
      const meName = $('me-name');
      const logoutBtn = $('logout-btn');
      const menuBtn = $('menu-btn');
      const menu = $('menu');
      const menuAvatar = $('menu-avatar');
      const menuName = $('menu-name');
      const dpBtn = $('dp-btn');
      const themeBtn = $('theme-btn');
      const themeLabel = $('theme-label');
      const dpModal = $('dp-modal');
      const dpGrid = $('dp-grid');
      const dpError = $('dp-error');
      const dpSave = $('dp-save');
      const dpCancel = $('dp-cancel');

      /* ---------- state ---------- */
      let me = null; // the logged-in user
      let mode = 'login'; // 'login' or 'signup'
      let loggingOut = false;
      let hasConnected = false;
      let focusOnConnect = false;
      let onlineCount = null;
      let onlineNames = [];
      let isTyping = false;
      let typingTimer = null;
      let limitTimer = null;
      let lastSender = null;
      let lastTime = 0;
      const typingUsers = new Map();

      // The socket only connects after the user is authenticated
      const socket = io({ autoConnect: false });

      /* ---------- small helpers ---------- */
      async function request(method, url, body) {
        try {
          const res = await fetch(url, {
            method,
            credentials: 'same-origin',
            headers: body ? { 'Content-Type': 'application/json' } : undefined,
            body: body ? JSON.stringify(body) : undefined
          });
          let data = {};
          try { data = await res.json(); } catch (e) { /* empty body */ }
          return { ok: res.ok, status: res.status, data };
        } catch (e) {
          return { ok: false, status: 0, data: { error: 'Network error. Check your connection and try again.' } };
        }
      }

      function buildAvatar(name, color, url, extraClass) {
        const el = document.createElement('div');
        el.className = 'avatar' + (extraClass ? ' ' + extraClass : '');
        el.style.background = color || '#6b4a7a';
        el.textContent = (name || '?').charAt(0).toUpperCase();
        if (url && url.indexOf('preset:') === 0) {
          const preset = PRESETS[url.slice(7)];
          if (preset) {
            el.textContent = '';
            el.insertAdjacentHTML('beforeend', preset.svg);
          }
        } else if (url) {
          const img = document.createElement('img');
          img.alt = '';
          img.referrerPolicy = 'no-referrer'; // Google avatars need this to load reliably
          img.addEventListener('error', () => img.remove());
          img.src = url;
          el.appendChild(img);
        }
        return el;
      }

      /* ---------- button ripple ---------- */
      document.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('button, .btn');
        if (!btn || btn.disabled) return;
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 2;
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.width = r.style.height = size + 'px';
        r.style.left = e.clientX - rect.left - size / 2 + 'px';
        r.style.top = e.clientY - rect.top - size / 2 + 'px';
        btn.appendChild(r);
        setTimeout(() => r.remove(), 650);
      });

      /* ================================================================ */
      /* Auth screen                                                      */
      /* ================================================================ */

      function showError(message) {
        formError.textContent = message;
        formError.classList.remove('show');
        void formError.offsetWidth; // restart the shake animation
        formError.classList.add('show');
      }

      function clearError() {
        formError.classList.remove('show');
        formError.textContent = '';
      }

      function setMode(next) {
        mode = next;
        tabs.dataset.mode = next;
        tabButtons.forEach((t) => {
          const active = t.dataset.mode === next;
          t.classList.toggle('active', active);
          t.setAttribute('aria-selected', String(active));
        });
        nameCollapse.classList.toggle('open', next === 'signup');
        submitBtn.textContent = next === 'signup' ? 'Create account' : 'Log in';
        authSub.textContent = next === 'signup'
          ? 'Create an account to join the room.'
          : 'Welcome back. Log in to join the room.';
        passwordInput.placeholder = next === 'signup' ? 'At least 8 characters' : 'Your password';
        passwordInput.autocomplete = next === 'signup' ? 'new-password' : 'current-password';
        clearError();
      }

      tabButtons.forEach((t) => t.addEventListener('click', () => setMode(t.dataset.mode)));

      pwToggle.addEventListener('click', () => {
        const show = passwordInput.type === 'password';
        passwordInput.type = show ? 'text' : 'password';
        pwToggle.classList.toggle('on', show);
        pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });

      function setLoading(on) {
        submitBtn.classList.toggle('loading', on);
        submitBtn.disabled = on;
      }

      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const displayName = displayInput.value.trim();

        if (!username || !password) {
          return showError('Enter your username and password.');
        }
        if (mode === 'signup') {
          if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            return showError('Username must be 3-20 characters: letters, numbers or underscores.');
          }
          if (password.length < 8) {
            return showError('Password must be at least 8 characters.');
          }
        }

        setLoading(true);
        const payload = mode === 'signup' ? { username, password, displayName } : { username, password };
        const { ok, data } = await request('POST', mode === 'signup' ? '/api/signup' : '/api/login', payload);
        setLoading(false);

        if (!ok) return showError(data.error || 'Something went wrong. Please try again.');

        passwordInput.value = '';
        enterChat(data.user);
      });

      /* ================================================================ */
      /* Switching between the auth screen and the chat room              */
      /* ================================================================ */

      function resetChatState() {
        typingUsers.clear();
        renderTyping();
        messagesEl.innerHTML = '';
        lastSender = null;
        lastTime = 0;
        onlineCount = null;
        onlineNames = [];
        hasConnected = false;
        input.value = '';
        setEmoji(false);
        jumpBtn.classList.remove('show');
        setComposerEnabled(false);
        renderStatus();
      }

      function showAuth(message) {
        me = null;
        loggingOut = false;
        resetChatState();
        setMode('login');
        authView.classList.remove('hidden');
        chatView.classList.add('hidden');
        if (message) showError(message);
        setTimeout(() => usernameInput.focus(), 500);
      }

      function enterChat(user) {
        me = user;
        loggingOut = false;
        resetChatState();

        meAvatar.innerHTML = '';
        meAvatar.appendChild(buildAvatar(user.displayName, user.color, user.avatar));
        meName.textContent = user.displayName;
        menuAvatar.innerHTML = '';
        menuAvatar.appendChild(buildAvatar(user.displayName, user.color, user.avatar));
        menuName.textContent = user.displayName;
        setMenu(false);
        closeDp();

        authView.classList.add('hidden');
        chatView.classList.remove('hidden');

        focusOnConnect = true;
        if (!socket.connected) socket.connect();
      }

      logoutBtn.addEventListener('click', async () => {
        loggingOut = true;
        await request('POST', '/api/logout');
        socket.disconnect();
        showAuth();
      });

      // Is the session still valid? If not, go back to the login screen.
      async function verifySession() {
        if (loggingOut) return;
        const res = await request('GET', '/api/check-auth');
        if (!res.ok) return; // network problem: keep trying to reconnect
        if (!res.data.authenticated) {
          socket.disconnect();
          showAuth('Your session has expired. Please log in again.');
        } else if (!socket.connected) {
          socket.connect();
        }
      }

      /* ================================================================ */
      /* Chat room                                                        */
      /* ================================================================ */

      /* ---------- emoji picker ---------- */
      const emojis = ['😀', '😂', '😍', '😎', '🤔', '😢', '😡', '🥳', '👍', '👎', '🙏', '🔥', '🎉', '❤️', '💯', '👀'];
      emojis.forEach((emoji, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = emoji;
        b.style.setProperty('--i', i);
        b.addEventListener('click', () => {
          input.value += emoji;
          input.focus();
          updateSend();
          handleTyping();
        });
        emojiBar.appendChild(b);
      });

      function setEmoji(open) {
        emojiBar.classList.toggle('open', open);
        emojiBtn.setAttribute('aria-label', open ? 'Close emoji picker' : 'Open emoji picker');
      }
      emojiBtn.addEventListener('click', () => setEmoji(!emojiBar.classList.contains('open')));
      document.addEventListener('click', (e) => {
        if (!emojiBar.contains(e.target) && !emojiBtn.contains(e.target)) setEmoji(false);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setEmoji(false);
      });

      /* ---------- status + composer state ---------- */
      function renderStatus() {
        if (socket.connected) {
          dot.className = 'dot online';
          if (onlineCount === null) statusText.textContent = 'Connected';
          else statusText.textContent = onlineCount === 1 ? '1 online' : onlineCount + ' online';
          pill.title = onlineNames.join(', ');
        } else {
          dot.className = 'dot';
          statusText.textContent = hasConnected ? 'Reconnecting...' : 'Connecting...';
          pill.title = '';
        }
      }

      function updateSend() {
        sendBtn.disabled = !socket.connected || !input.value.trim();
      }

      function setComposerEnabled(enabled) {
        input.disabled = !enabled;
        updateSend();
      }

      /* ---------- scrolling ---------- */
      function isNearBottom() {
        return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;
      }
      function scrollToBottom(smooth) {
        messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
        jumpBtn.classList.remove('show');
      }
      messagesEl.addEventListener('scroll', () => {
        if (isNearBottom()) jumpBtn.classList.remove('show');
      });
      jumpBtn.addEventListener('click', () => scrollToBottom(true));

      /* ---------- rendering messages ---------- */
      function formatTime(ts) {
        return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function clearEmpty() {
        const empty = messagesEl.querySelector('.empty');
        if (empty) empty.remove();
      }

      function showEmptyIfNeeded() {
        if (messagesEl.children.length > 0) return;
        const el = document.createElement('div');
        el.className = 'empty';
        const title = document.createElement('strong');
        title.textContent = 'No messages yet';
        const sub = document.createElement('span');
        sub.textContent = 'Say hi and start the conversation.';
        el.appendChild(title);
        el.appendChild(sub);
        messagesEl.appendChild(el);
      }

      function addChatMessage(msg, animate) {
        clearEmpty();

        const own = Boolean(me) && msg.userId === me.id;
        const grouped = lastSender === msg.userId && msg.time - lastTime < 120000;
        lastSender = msg.userId;
        lastTime = msg.time;

        const row = document.createElement('div');
        row.className = 'row' + (own ? ' own' : '') + (grouped ? ' grouped' : '') + (animate ? ' enter' : '');
        row.dataset.uid = msg.userId;
        row.dataset.name = msg.name;
        row.dataset.color = msg.color;

        const avatar = buildAvatar(msg.name, msg.color, msg.avatar, grouped ? 'hidden' : '');

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (!grouped) {
          const meta = document.createElement('div');
          meta.className = 'meta';

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = own ? 'You' : msg.name;

          const time = document.createElement('span');
          time.className = 'time';
          time.textContent = formatTime(msg.time);

          meta.appendChild(name);
          meta.appendChild(time);
          bubble.appendChild(meta);
        }

        const text = document.createElement('div');
        text.textContent = msg.text; // textContent keeps user input from injecting HTML
        bubble.appendChild(text);

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
      }

      function addSystemMessage(text) {
        clearEmpty();
        lastSender = null;
        const el = document.createElement('div');
        el.className = 'system';
        el.textContent = text;
        messagesEl.appendChild(el);
      }

      function renderTyping() {
        const names = Array.from(typingUsers.values());
        if (names.length === 0) {
          typingEl.classList.remove('show');
          return;
        }
        if (names.length === 1) typingText.textContent = names[0] + ' is typing';
        else if (names.length === 2) typingText.textContent = names[0] + ' and ' + names[1] + ' are typing';
        else typingText.textContent = 'Several people are typing';
        typingEl.classList.add('show');
      }

      /* ---------- typing indicator (outgoing) ---------- */
      function stopTyping() {
        clearTimeout(typingTimer);
        if (isTyping) {
          isTyping = false;
          if (socket.connected) socket.emit('typing', false);
        }
      }
      function handleTyping() {
        if (!socket.connected) return;
        if (!isTyping) {
          isTyping = true;
          socket.emit('typing', true);
        }
        clearTimeout(typingTimer);
        typingTimer = setTimeout(stopTyping, 2000);
      }
      input.addEventListener('input', () => {
        updateSend();
        handleTyping();
      });

      /* ---------- sending ---------- */
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !socket.connected) return;

        socket.emit('chat-message', text);
        stopTyping();
        input.value = '';
        updateSend();
        setEmoji(false);

        sendBtn.classList.remove('fly');
        void sendBtn.offsetWidth; // restart the animation
        sendBtn.classList.add('fly');
        setTimeout(() => sendBtn.classList.remove('fly'), 650);

        input.focus();
      });

      /* ---------- socket events ---------- */
      socket.on('connect', () => {
        hasConnected = true;
        setComposerEnabled(true);
        renderStatus();
        if (focusOnConnect) {
          focusOnConnect = false;
          setTimeout(() => input.focus(), 350);
        }
      });

      socket.on('disconnect', (reason) => {
        typingUsers.clear();
        renderTyping();
        setComposerEnabled(false);
        renderStatus();
        // The server closed the connection (for example after logging out in another tab)
        if (reason === 'io server disconnect') verifySession();
      });

      // Rejected at the handshake (not logged in) or the network is down
      socket.on('connect_error', () => {
        renderStatus();
        verifySession();
      });

      socket.on('history', (list) => {
        messagesEl.innerHTML = '';
        lastSender = null;
        list.forEach((m) => addChatMessage(m, false));
        showEmptyIfNeeded();
        scrollToBottom(false);
      });

      socket.on('chat-message', (msg) => {
        const own = Boolean(me) && msg.userId === me.id;
        const stick = isNearBottom() || own;
        typingUsers.delete(msg.userId);
        renderTyping();
        addChatMessage(msg, true);
        if (stick) scrollToBottom(true);
        else jumpBtn.classList.add('show');
      });

      socket.on('system-message', (msg) => {
        const stick = isNearBottom();
        addSystemMessage(msg.text);
        if (stick) scrollToBottom(true);
      });

      socket.on('online', (data) => {
        const changed = onlineCount !== null && onlineCount !== data.count;
        onlineCount = data.count;
        onlineNames = data.names;
        renderStatus();
        if (changed) {
          pill.classList.remove('bump');
          void pill.offsetWidth;
          pill.classList.add('bump');
        }
      });

      socket.on('typing', (data) => {
        if (data.isTyping) typingUsers.set(data.id, data.name);
        else typingUsers.delete(data.id);
        renderTyping();
      });

      socket.on('rate-limited', () => {
        limitNote.classList.add('show');
        clearTimeout(limitTimer);
        limitTimer = setTimeout(() => limitNote.classList.remove('show'), 2200);
      });

      /* ================================================================ */
      /* Options menu, theme, change DP, keyboard-safe layout             */
      /* ================================================================ */

      const svgWrap = (inner) => '<svg viewBox="0 0 64 64" aria-hidden="true">' + inner + '</svg>';
      const PRESETS = {
        fox: { label: 'Fox', svg: svgWrap('<rect width="64" height="64" fill="#fdba74"/><path d="M8 12L23 24H41L56 12L58 38L32 58L6 38Z" fill="#f97316"/><path d="M6 38L22 34L32 44L42 34L58 38L32 58Z" fill="#fff7ed"/><path d="M12 18L21 25L13 30ZM52 18L43 25L51 30Z" fill="#7c2d12" opacity=".6"/><circle cx="23" cy="32" r="2.6" fill="#1c1917"/><circle cx="41" cy="32" r="2.6" fill="#1c1917"/><circle cx="32" cy="52" r="3" fill="#1c1917"/>') },
        cat: { label: 'Cat', svg: svgWrap('<rect width="64" height="64" fill="#ddd6fe"/><path d="M12 8L27 20L10 30ZM52 8L37 20L54 30Z" fill="#475569"/><path d="M14 15L22 21L13 26ZM50 15L42 21L51 26Z" fill="#fda4af"/><ellipse cx="32" cy="38" rx="21" ry="19" fill="#64748b"/><ellipse cx="23" cy="35" rx="4.5" ry="5" fill="#fde047"/><ellipse cx="41" cy="35" rx="4.5" ry="5" fill="#fde047"/><ellipse cx="23" cy="35" rx="1.4" ry="4" fill="#0f172a"/><ellipse cx="41" cy="35" rx="1.4" ry="4" fill="#0f172a"/><path d="M29.5 43h5l-2.5 3z" fill="#fb7185"/><path d="M32 46q-3 4-6 2M32 46q3 4 6 2" stroke="#0f172a" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M6 40L17 42M6 47L17 45M58 40L47 42M58 47L47 45" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>') },
        panda: { label: 'Panda', svg: svgWrap('<rect width="64" height="64" fill="#bbf7d0"/><circle cx="15" cy="15" r="8" fill="#18181b"/><circle cx="49" cy="15" r="8" fill="#18181b"/><ellipse cx="32" cy="36" rx="21" ry="19" fill="#fafafa"/><ellipse cx="23" cy="34" rx="5" ry="6.5" fill="#18181b" transform="rotate(-20 23 34)"/><ellipse cx="41" cy="34" rx="5" ry="6.5" fill="#18181b" transform="rotate(20 41 34)"/><circle cx="23.5" cy="33" r="1.8" fill="#fff"/><circle cx="40.5" cy="33" r="1.8" fill="#fff"/><ellipse cx="32" cy="43" rx="3.5" ry="2.5" fill="#18181b"/><path d="M32 45.5v2M28 49q4 3 8 0" stroke="#18181b" stroke-width="1.3" fill="none" stroke-linecap="round"/>') },
        robot: { label: 'Robot', svg: svgWrap('<rect width="64" height="64" fill="#7dd3fc"/><path d="M32 6V15" stroke="#334155" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="6" r="3.5" fill="#f43f5e"/><rect x="7" y="28" width="6" height="14" rx="2" fill="#64748b"/><rect x="51" y="28" width="6" height="14" rx="2" fill="#64748b"/><rect x="12" y="15" width="40" height="36" rx="9" fill="#e2e8f0"/><rect x="17" y="22" width="30" height="18" rx="6" fill="#0f172a"/><rect x="22" y="27" width="7" height="7" rx="2" fill="#22d3ee"/><rect x="35" y="27" width="7" height="7" rx="2" fill="#22d3ee"/><rect x="27" y="45" width="10" height="3" rx="1.5" fill="#94a3b8"/>') },
        alien: { label: 'Alien', svg: svgWrap('<rect width="64" height="64" fill="#312e81"/><circle cx="10" cy="12" r="1.2" fill="#fff"/><circle cx="54" cy="10" r="1.5" fill="#fff"/><circle cx="52" cy="54" r="1.2" fill="#fff"/><circle cx="8" cy="50" r="1.4" fill="#fff"/><path d="M32 8C50 8 56 28 46 46C42 54 22 54 18 46C8 28 14 8 32 8Z" fill="#86efac"/><ellipse cx="23" cy="31" rx="7" ry="10" fill="#052e16" transform="rotate(-28 23 31)"/><ellipse cx="41" cy="31" rx="7" ry="10" fill="#052e16" transform="rotate(28 41 31)"/><circle cx="21" cy="27" r="1.8" fill="#fff"/><circle cx="43" cy="27" r="1.8" fill="#fff"/><path d="M28 47q4 2.5 8 0" stroke="#166534" stroke-width="1.5" fill="none" stroke-linecap="round"/>') },
        owl: { label: 'Owl', svg: svgWrap('<rect width="64" height="64" fill="#fde68a"/><path d="M12 10L24 18L10 24ZM52 10L40 18L54 24Z" fill="#78350f"/><ellipse cx="32" cy="36" rx="22" ry="21" fill="#a16207"/><ellipse cx="32" cy="46" rx="12" ry="10" fill="#fef3c7"/><circle cx="23" cy="31" r="9" fill="#fff"/><circle cx="41" cy="31" r="9" fill="#fff"/><circle cx="24" cy="32" r="4" fill="#1c1917"/><circle cx="40" cy="32" r="4" fill="#1c1917"/><circle cx="25.5" cy="30.5" r="1.4" fill="#fff"/><circle cx="41.5" cy="30.5" r="1.4" fill="#fff"/><path d="M29 37h6l-3 6z" fill="#f97316"/>') },
        ghost: { label: 'Ghost', svg: svgWrap('<rect width="64" height="64" fill="#c7d2fe"/><path d="M14 54V30C14 16 22 9 32 9C42 9 50 16 50 30V54L44 49L38 54L32 49L26 54L20 49Z" fill="#fff"/><ellipse cx="25" cy="29" rx="2.6" ry="3.6" fill="#1e1b4b"/><ellipse cx="39" cy="29" rx="2.6" ry="3.6" fill="#1e1b4b"/><ellipse cx="20" cy="37" rx="3.5" ry="2" fill="#fda4af"/><ellipse cx="44" cy="37" rx="3.5" ry="2" fill="#fda4af"/><path d="M29 38q3 3.5 6 0" stroke="#1e1b4b" stroke-width="1.5" fill="none" stroke-linecap="round"/>') },
        frog: { label: 'Frog', svg: svgWrap('<rect width="64" height="64" fill="#d9f99d"/><ellipse cx="32" cy="40" rx="24" ry="17" fill="#22c55e"/><circle cx="20" cy="22" r="10" fill="#22c55e"/><circle cx="44" cy="22" r="10" fill="#22c55e"/><circle cx="20" cy="22" r="6.5" fill="#fff"/><circle cx="44" cy="22" r="6.5" fill="#fff"/><circle cx="21" cy="23" r="3.2" fill="#14532d"/><circle cx="43" cy="23" r="3.2" fill="#14532d"/><circle cx="28" cy="35" r="1.2" fill="#14532d"/><circle cx="36" cy="35" r="1.2" fill="#14532d"/><path d="M16 42Q32 54 48 42" stroke="#14532d" stroke-width="2" fill="none" stroke-linecap="round"/>') },
        astronaut: { label: 'Astronaut', svg: svgWrap('<rect width="64" height="64" fill="#0f172a"/><circle cx="8" cy="10" r="1" fill="#fff"/><circle cx="56" cy="14" r="1.2" fill="#fff"/><circle cx="54" cy="54" r="1" fill="#fff"/><circle cx="9" cy="52" r="1.3" fill="#fff"/><path d="M32 11V6" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="5.5" r="2.5" fill="#fbbf24"/><circle cx="32" cy="34" r="22" fill="#f1f5f9"/><ellipse cx="32" cy="34" rx="16" ry="13.5" fill="#1e293b"/><path d="M22 28q4-6 11-6" stroke="#7dd3fc" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="27" cy="35" r="1.6" fill="#e2e8f0"/><circle cx="37" cy="35" r="1.6" fill="#e2e8f0"/><path d="M28 40q4 3 8 0" stroke="#e2e8f0" stroke-width="1.4" fill="none" stroke-linecap="round"/>') },
        penguin: { label: 'Penguin', svg: svgWrap('<rect width="64" height="64" fill="#bae6fd"/><ellipse cx="25" cy="58" rx="6" ry="2.5" fill="#fb923c"/><ellipse cx="39" cy="58" rx="6" ry="2.5" fill="#fb923c"/><ellipse cx="13" cy="40" rx="4" ry="11" fill="#1e293b" transform="rotate(14 13 40)"/><ellipse cx="51" cy="40" rx="4" ry="11" fill="#1e293b" transform="rotate(-14 51 40)"/><ellipse cx="32" cy="36" rx="19" ry="22" fill="#1e293b"/><ellipse cx="32" cy="41" rx="12" ry="15" fill="#f8fafc"/><circle cx="26" cy="27" r="4.2" fill="#fff"/><circle cx="38" cy="27" r="4.2" fill="#fff"/><circle cx="27" cy="27.5" r="2" fill="#0f172a"/><circle cx="37" cy="27.5" r="2" fill="#0f172a"/><path d="M28.5 32h7L32 37z" fill="#fb923c"/>') }
      };
      const PRESET_IDS = Object.keys(PRESETS);

      /* ---------- theme (dark / light) ---------- */
      const rootEl = document.documentElement;
      function currentTheme() { return rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
      function applyTheme(theme, persist) {
        if (theme === 'light') rootEl.setAttribute('data-theme', 'light');
        else rootEl.removeAttribute('data-theme');
        const tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', theme === 'light' ? '#fffcfd' : '#000000');
        const cs = document.querySelector('meta[name="color-scheme"]');
        if (cs) cs.setAttribute('content', theme === 'light' ? 'light' : 'dark');
        themeLabel.textContent = theme === 'light' ? 'Dark mode' : 'Light mode';
        if (persist) { try { localStorage.setItem('atti-theme', theme); } catch (e) { /* storage blocked */ } }
      }
      themeBtn.addEventListener('click', () => {
        applyTheme(currentTheme() === 'light' ? 'dark' : 'light', true);
        setMenu(false);
      });

      /* ---------- options menu ---------- */
      function setMenu(open) {
        menu.classList.toggle('open', open);
        menu.setAttribute('aria-hidden', String(!open));
        menuBtn.setAttribute('aria-expanded', String(open));
      }
      menuBtn.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
      logoutBtn.addEventListener('click', () => setMenu(false));
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && !menuBtn.contains(e.target)) setMenu(false);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { setMenu(false); closeDp(); }
      });

      /* ---------- change DP ---------- */
      let dpChoice = null;
      let dpCurrent = null;

      PRESET_IDS.forEach((id) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dp-opt';
        b.dataset.id = id;
        b.setAttribute('aria-label', PRESETS[id].label);
        b.title = PRESETS[id].label;
        b.innerHTML = PRESETS[id].svg;
        b.addEventListener('click', () => selectDp(id));
        dpGrid.appendChild(b);
      });

      function selectDp(id) {
        dpChoice = id;
        Array.from(dpGrid.children).forEach((b) => b.classList.toggle('selected', b.dataset.id === id));
        dpSave.disabled = !id || id === dpCurrent;
        dpError.classList.remove('show');
      }

      function openDp() {
        dpCurrent = me && me.avatar && me.avatar.indexOf('preset:') === 0 ? me.avatar.slice(7) : null;
        selectDp(dpCurrent);
        dpSave.disabled = true;
        dpModal.classList.add('open');
        dpModal.setAttribute('aria-hidden', 'false');
        setMenu(false);
      }
      function closeDp() {
        dpModal.classList.remove('open');
        dpModal.setAttribute('aria-hidden', 'true');
      }
      dpBtn.addEventListener('click', openDp);
      dpCancel.addEventListener('click', closeDp);
      dpModal.addEventListener('click', (e) => { if (e.target === dpModal) closeDp(); });

      dpSave.addEventListener('click', async () => {
        if (!dpChoice || !me) return;
        dpSave.classList.add('loading');
        dpSave.disabled = true;
        const { ok, data } = await request('POST', '/api/avatar', { avatar: dpChoice });
        dpSave.classList.remove('loading');
        if (!ok) {
          dpSave.disabled = false;
          dpError.textContent = data.error || 'Could not save your avatar. Please try again.';
          dpError.classList.remove('show');
          void dpError.offsetWidth;
          dpError.classList.add('show');
          return;
        }
        applyAvatarUpdate(me.id, data.user.avatar);
        closeDp();
      });

      // Swap the avatar everywhere it is on screen
      function applyAvatarUpdate(userId, avatar) {
        if (me && me.id === userId) {
          me.avatar = avatar;
          meAvatar.innerHTML = '';
          meAvatar.appendChild(buildAvatar(me.displayName, me.color, avatar));
          menuAvatar.innerHTML = '';
          menuAvatar.appendChild(buildAvatar(me.displayName, me.color, avatar));
        }
        messagesEl.querySelectorAll('.row').forEach((row) => {
          if (row.dataset.uid !== userId) return;
          const old = row.firstElementChild;
          const fresh = buildAvatar(row.dataset.name, row.dataset.color, avatar, old.classList.contains('hidden') ? 'hidden' : '');
          row.replaceChild(fresh, old);
        });
      }
      socket.on('avatar-updated', (d) => applyAvatarUpdate(d.userId, d.avatar));

      /* ---------- keep the UI fixed when the mobile keyboard opens ---------- */
      (function keyboardSafeLayout() {
        const vv = window.visualViewport;
        if (!vv) return;
        let stickToBottom = true;
        let frame = 0;
        messagesEl.addEventListener('scroll', () => { stickToBottom = isNearBottom(); });

        function update() {
          frame = 0;
          rootEl.style.setProperty('--vv-h', vv.height + 'px');
          rootEl.style.setProperty('--vv-top', vv.offsetTop + 'px');
          if (stickToBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        function schedule() { if (!frame) frame = requestAnimationFrame(update); }
        vv.addEventListener('resize', schedule);
        vv.addEventListener('scroll', schedule);
        window.addEventListener('orientationchange', schedule);
        update();
      })();

      applyTheme(currentTheme(), false);

      /* ================================================================ */
      /* Start up                                                         */
      /* ================================================================ */

      async function boot() {
        // Messages from the Google sign-in redirect (?error=...)
        const errors = {
          google_failed: 'Google sign-in did not complete. Please try again.',
          google_unavailable: 'Google sign-in is not set up on this server yet.'
        };
        const errorCode = new URLSearchParams(window.location.search).get('error');
        const pendingError = errorCode ? errors[errorCode] || 'Sign-in failed. Please try again.' : '';
        if (errorCode) window.history.replaceState({}, '', '/');

        const { ok, data } = await request('GET', '/api/check-auth');

        if (ok && data.authenticated) {
          enterChat(data.user);
        } else {
          showAuth(pendingError || (ok ? '' : data.error));
        }
        splash.classList.add('gone');
      }

      setMode('login');
      renderStatus();
      boot();
    })();
  </script>
</body>
