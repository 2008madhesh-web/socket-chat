<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b8325f" />
  <title>Atti chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3eff7;
      --panel: #fffdfe;
      --text: #261a33;
      --muted: #85768f;
      --border: #eae2f0;
      --field: #f6f2f9;
      --accent: #b8325f;
      --accent-hover: #9f2a52;
      --bubble: #f1ebf6;
      --bubble-own: #b8325f;
      --on-accent: #ffffff;
      --online: #2fb36d;
      --shadow: 0 24px 60px rgba(70, 30, 90, 0.14);
      --pop-shadow: 0 10px 28px rgba(70, 30, 90, 0.22);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #120b19;
      --panel: #1b1226;
      --text: #f1e9f7;
      --muted: #a090ae;
      --border: #2d2039;
      --field: #241831;
      --accent: #d9436f;
      --accent-hover: #ec5a85;
      --bubble: #2a1d38;
      --bubble-own: #d9436f;
      --online: #3ddc84;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      --pop-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.5s var(--ease), color 0.5s var(--ease);
    }

    /* ---------- shell ---------- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      background: var(--panel);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: background-color 0.5s var(--ease), box-shadow 0.5s var(--ease);
      animation: appIn 0.8s var(--ease) both;
    }

    @media (min-width: 800px) {
      .app {
        height: calc(100dvh - 48px);
        margin: 24px auto;
        border-radius: 26px;
      }
    }

    @keyframes appIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- buttons (shared) ---------- */
    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.28;
      transform: scale(0);
      pointer-events: none;
      animation: ripple 0.6s var(--ease) forwards;
    }
    @keyframes ripple {
      to { transform: scale(1); opacity: 0; }
    }

    .primary {
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      transition: transform 0.25s var(--spring), background-color 0.25s ease, box-shadow 0.3s ease, opacity 0.25s ease;
    }
    .primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(184, 50, 95, 0.35);
    }
    .primary:active:not(:disabled) {
      transform: translateY(0) scale(0.95);
      box-shadow: none;
    }
    .primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--field);
      color: var(--text);
      transition: transform 0.3s var(--spring), background-color 0.25s ease, color 0.25s ease;
    }
    .icon-btn:hover { background: var(--bubble); transform: scale(1.1); }
    .icon-btn:active { transform: scale(0.88); }
    .icon-btn svg { width: 20px; height: 20px; display: block; }

    /* ---------- header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.5s var(--ease);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .logo {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #ffffff;
      transition: transform 0.5s var(--spring), background-color 0.4s ease;
      animation: logoIn 0.9s var(--spring) 0.25s both;
    }
    .logo:hover { transform: rotate(-8deg) scale(1.08); }
    .logo svg { width: 24px; height: 24px; }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.4) rotate(-25deg); }
      to { opacity: 1; transform: none; }
    }

    .brand-text { min-width: 0; }
    .brand-text h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .credit {
      margin-top: 3px;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    .credit b { font-weight: 600; color: var(--text); }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--field);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      transition: background-color 0.4s ease, transform 0.3s var(--spring);
    }
    .pill.bump { animation: bump 0.45s var(--spring); }
    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      position: relative;
      transition: background-color 0.4s ease;
    }
    .dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      animation: pulse 2s ease-out infinite;
    }
    .dot.online { background: var(--online); }
    .dot.offline { background: #ef4444; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    /* theme icon swap */
    #theme-btn .sun, #theme-btn .moon {
      position: absolute;
      transition: transform 0.55s var(--spring), opacity 0.3s ease;
    }
    [data-theme="light"] #theme-btn .sun { transform: rotate(-90deg) scale(0); opacity: 0; }
    [data-theme="light"] #theme-btn .moon { transform: none; opacity: 1; }
    [data-theme="dark"] #theme-btn .moon { transform: rotate(90deg) scale(0); opacity: 0; }
    [data-theme="dark"] #theme-btn .sun { transform: none; opacity: 1; }

    /* ---------- messages ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      animation: fadeIn 0.8s var(--ease) both;
    }
    .empty strong {
      display: block;
      margin-bottom: 4px;
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--text);
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .row.grouped { margin-top: 2px; }
    .row.own { flex-direction: row-reverse; }

    .row.enter .bubble {
      animation: bubbleIn 0.45s var(--spring) both;
      transform-origin: bottom left;
    }
    .row.own.enter .bubble { transform-origin: bottom right; }
    .row.enter .avatar:not(.hidden) { animation: avatarIn 0.5s var(--spring) both; }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(14px) scale(0.85); }
      to { opacity: 1; transform: none; }
    }
    @keyframes avatarIn {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: none; }
    }

    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
    }
    .avatar.hidden { visibility: hidden; }

    .bubble {
      max-width: 76%;
      padding: 9px 14px;
      border-radius: 18px 18px 18px 6px;
      background: var(--bubble);
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-wrap: break-word;
      white-space: pre-wrap;
      transition: background-color 0.5s var(--ease), transform 0.3s var(--ease);
    }
    .row.own .bubble {
      background: var(--bubble-own);
      color: var(--on-accent);
      border-radius: 18px 18px 6px 18px;
    }
    .row.grouped .bubble { border-radius: 18px 18px 18px 6px; }
    .row.grouped:not(.own) .bubble { border-top-left-radius: 6px; }
    .row.own.grouped .bubble { border-radius: 18px 6px 6px 18px; }

    .meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
      font-size: 0.74rem;
    }
    .meta .name { font-weight: 700; }
    .meta .time { opacity: 0.6; font-size: 0.68rem; }

    .system {
      align-self: center;
      margin: 12px 0 4px;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--field);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      animation: systemIn 0.5s var(--ease) both;
    }
    @keyframes systemIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- jump button ---------- */
    #jump {
      position: absolute;
      left: 50%;
      bottom: 138px;
      padding: 9px 18px;
      font-size: 0.85rem;
      box-shadow: var(--pop-shadow);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, 16px) scale(0.9);
      transition: opacity 0.3s ease, transform 0.45s var(--spring), visibility 0.3s, background-color 0.25s ease;
    }
    #jump.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }
    #jump.show:hover:not(:disabled) { transform: translate(-50%, -2px) scale(1.03); }
    #jump.show:active:not(:disabled) { transform: translate(-50%, 0) scale(0.95); }

    /* ---------- typing ---------- */
    #typing {
      height: 24px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.4s var(--ease);
    }
    #typing.show { opacity: 1; transform: none; }
    .dots { display: inline-flex; gap: 3px; }
    .dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: hop 1.1s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes hop {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ---------- emoji panel ---------- */
    #emoji-bar {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      margin: 0 12px;
      padding: 0 8px;
      border-radius: 18px;
      background: var(--field);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(10px);
      transition: max-height 0.45s var(--ease), opacity 0.3s ease, transform 0.45s var(--ease), padding 0.45s var(--ease), margin 0.45s var(--ease);
    }
    #emoji-bar.open {
      max-height: 130px;
      opacity: 1;
      transform: none;
      padding: 8px;
      margin-bottom: 8px;
    }
    #emoji-bar button {
      padding: 6px 0;
      font-size: 1.4rem;
      line-height: 1;
      background: transparent;
      border-radius: 12px;
      opacity: 0;
      transform: scale(0.4);
      transition: transform 0.35s var(--spring), opacity 0.25s ease, background-color 0.2s ease;
    }
    #emoji-bar.open button {
      opacity: 1;
      transform: none;
      transition-delay: calc(var(--i) * 18ms), calc(var(--i) * 18ms), 0s;
    }
    #emoji-bar.open button:hover { background: var(--bubble); transform: scale(1.3); transition-delay: 0s; }
    #emoji-bar.open button:active { transform: scale(0.8); transition-delay: 0s; }

    /* ---------- composer ---------- */
    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      transition: border-color 0.5s var(--ease);
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 16px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--field);
      color: var(--text);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.35s ease, background-color 0.4s ease, transform 0.3s var(--ease);
    }
    input[type="text"]::placeholder { color: var(--muted); transition: opacity 0.3s ease; }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 5px rgba(184, 50, 95, 0.14);
    }
    input[type="text"]:focus::placeholder { opacity: 0.5; }
    input[type="text"]:disabled { opacity: 0.6; }

    #send {
      width: 48px;
      height: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    #send svg {
      width: 22px;
      height: 22px;
      transition: transform 0.35s var(--spring);
    }
    #send:hover:not(:disabled) svg { transform: translate(2px, -2px) rotate(8deg); }
    #send.fly svg { animation: fly 0.6s var(--ease); }
    @keyframes fly {
      0% { transform: none; opacity: 1; }
      45% { transform: translate(26px, -26px) scale(0.6); opacity: 0; }
      46% { transform: translate(-26px, 26px) scale(0.6); opacity: 0; }
      100% { transform: none; opacity: 1; }
    }

    #limit-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 82px;
      margin: 0 auto;
      width: max-content;
      max-width: 90%;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--text);
      color: var(--panel);
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.4s var(--spring);
    }
    #limit-note.show { opacity: 1; transform: none; }

    /* ---------- join modal ---------- */
    #modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(18, 8, 28, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s var(--ease), visibility 0.5s, backdrop-filter 0.5s var(--ease);
    }
    #modal.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      padding: 30px 26px 26px;
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
      transition: transform 0.55s var(--ease), opacity 0.4s ease;
      animation: cardIn 0.8s var(--spring) 0.1s both;
    }
    #modal.hidden .modal-card { transform: translateY(24px) scale(0.92); opacity: 0; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.9); }
      to { opacity: 1; transform: none; }
    }

    .modal-card .logo { margin: 0 auto 16px; width: 58px; height: 58px; border-radius: 19px; animation-delay: 0.35s; }
    .modal-card .logo svg { width: 32px; height: 32px; }
    .modal-card h2 {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .modal-card p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .modal-card form { display: flex; flex-direction: column; gap: 12px; }
    .modal-card .primary { padding: 14px 22px; }
    .modal-card .credit { margin-top: 18px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.6"/></svg>
        </div>
        <div class="brand-text">
          <h1>Atti chat</h1>
          <div class="credit">developed by <b>Madhesh</b></div>
        </div>
      </div>

      <div class="header-right">
        <div class="pill" id="pill">
          <span class="dot" id="dot"></span>
          <span id="status-text">Connecting...</span>
        </div>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div id="messages"></div>

    <button class="primary" id="jump" type="button">New messages ↓</button>
    <div id="limit-note">Slow down a little — too many messages at once.</div>

    <div id="typing"><span class="dots"><i></i><i></i><i></i></span><span id="typing-text"></span></div>

    <div id="emoji-bar"></div>

    <form class="composer" id="form">
      <button class="icon-btn" id="emoji-btn" type="button" aria-label="Open emoji picker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 14.5a4.6 4.6 0 0 0 8 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.8"/></svg>
      </button>
      <input id="input" type="text" placeholder="Write a message" autocomplete="off" maxlength="500" disabled />
      <button class="primary" id="send" type="submit" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>

  <div id="modal">
    <div class="modal-card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.6"/></svg>
      </div>
      <h2>Welcome to Atti chat</h2>
      <p>Pick a nickname and jump in.</p>
      <form id="join-form">
        <input id="name-input" type="text" placeholder="Your nickname" maxlength="20" autocomplete="off" aria-label="Nickname" />
        <button class="primary" type="submit">Join chat</button>
      </form>
      <div class="credit">developed by <b>Madhesh</b></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const $ = (id) => document.getElementById(id);
    const messagesEl = $('messages');
    const form = $('form');
    const input = $('input');
    const sendBtn = $('send');
    const jumpBtn = $('jump');
    const typingEl = $('typing');
    const typingText = $('typing-text');
    const emojiBar = $('emoji-bar');
    const emojiBtn = $('emoji-btn');
    const modal = $('modal');
    const joinForm = $('join-form');
    const nameInput = $('name-input');
    const dot = $('dot');
    const pill = $('pill');
    const statusText = $('status-text');
    const themeBtn = $('theme-btn');
    const limitNote = $('limit-note');

    let joined = false;
    let myName = '';
    let onlineCount = null;
    let onlineNames = [];
    let isTyping = false;
    let typingTimer = null;
    let limitTimer = null;
    let lastSender = null;
    let lastTime = 0;
    const typingUsers = new Map();

    /* ---------- storage helpers ---------- */
    function store(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
    function load(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    /* ---------- theme ---------- */
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#1b1226' : '#b8325f');
    }
    applyTheme(load('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      store('theme', next);
    });

    /* ---------- button ripple ---------- */
    document.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const r = document.createElement('span');
      r.className = 'ripple';
      r.style.width = r.style.height = size + 'px';
      r.style.left = e.clientX - rect.left - size / 2 + 'px';
      r.style.top = e.clientY - rect.top - size / 2 + 'px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 650);
    });

    /* ---------- emoji picker ---------- */
    const emojis = ['😀', '😂', '😍', '😎', '🤔', '😢', '😡', '🥳', '👍', '👎', '🙏', '🔥', '🎉', '❤️', '💯', '👀'];
    emojis.forEach((emoji, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = emoji;
      b.style.setProperty('--i', i);
      b.addEventListener('click', () => {
        input.value += emoji;
        input.focus();
        updateSend();
        handleTyping();
      });
      emojiBar.appendChild(b);
    });
    function setEmoji(open) {
      emojiBar.classList.toggle('open', open);
      emojiBtn.setAttribute('aria-label', open ? 'Close emoji picker' : 'Open emoji picker');
    }
    emojiBtn.addEventListener('click', () => setEmoji(!emojiBar.classList.contains('open')));
    document.addEventListener('click', (e) => {
      if (!emojiBar.contains(e.target) && !emojiBtn.contains(e.target)) setEmoji(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setEmoji(false);
    });

    /* ---------- status ---------- */
    function renderStatus() {
      if (socket.connected) {
        dot.className = 'dot online';
        if (joined && onlineCount !== null) {
          statusText.textContent = onlineCount === 1 ? '1 online' : onlineCount + ' online';
        } else {
          statusText.textContent = 'Connected';
        }
        pill.title = onlineNames.join(', ');
      } else {
        dot.className = 'dot offline';
        statusText.textContent = 'Reconnecting...';
        pill.title = '';
      }
    }

    function updateSend() {
      sendBtn.disabled = !joined || !input.value.trim();
    }
    function setInputEnabled(enabled) {
      input.disabled = !enabled;
      updateSend();
    }

    /* ---------- scrolling ---------- */
    function isNearBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;
    }
    function scrollToBottom(smooth) {
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      jumpBtn.classList.remove('show');
    }
    messagesEl.addEventListener('scroll', () => {
      if (isNearBottom()) jumpBtn.classList.remove('show');
    });
    jumpBtn.addEventListener('click', () => scrollToBottom(true));

    /* ---------- rendering ---------- */
    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function clearEmpty() {
      const empty = messagesEl.querySelector('.empty');
      if (empty) empty.remove();
    }

    function showEmptyIfNeeded() {
      if (messagesEl.children.length === 0) {
        const el = document.createElement('div');
        el.className = 'empty';
        const strong = document.createElement('strong');
        strong.textContent = 'No messages yet';
        const sub = document.createElement('span');
        sub.textContent = 'Say hi and start the conversation.';
        el.appendChild(strong);
        el.appendChild(sub);
        messagesEl.appendChild(el);
      }
    }

    function addChatMessage(msg, animate) {
      clearEmpty();
      const own = msg.senderSocketId === socket.id;
      const grouped = lastSender === msg.senderSocketId && msg.time - lastTime < 120000;
      lastSender = msg.senderSocketId;
      lastTime = msg.time;

      const row = document.createElement('div');
      row.className = 'row' + (own ? ' own' : '') + (grouped ? ' grouped' : '') + (animate ? ' enter' : '');

      const avatar = document.createElement('div');
      avatar.className = 'avatar' + (grouped ? ' hidden' : '');
      avatar.style.background = msg.color;
      avatar.textContent = (msg.name || '?').charAt(0).toUpperCase();

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (!grouped) {
        const meta = document.createElement('div');
        meta.className = 'meta';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = own ? 'You' : msg.name;

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = formatTime(msg.time);

        meta.appendChild(name);
        meta.appendChild(time);
        bubble.appendChild(meta);
      }

      const text = document.createElement('div');
      text.textContent = msg.text;
      bubble.appendChild(text);

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    }

    function addSystemMessage(text) {
      clearEmpty();
      lastSender = null;
      const el = document.createElement('div');
      el.className = 'system';
      el.textContent = text;
      messagesEl.appendChild(el);
    }

    function renderTyping() {
      const names = Array.from(typingUsers.values());
      if (names.length === 0) {
        typingEl.classList.remove('show');
        return;
      }
      if (names.length === 1) typingText.textContent = names[0] + ' is typing';
      else if (names.length === 2) typingText.textContent = names[0] + ' and ' + names[1] + ' are typing';
      else typingText.textContent = 'Several people are typing';
      typingEl.classList.add('show');
    }

    /* ---------- typing emit ---------- */
    function stopTyping() {
      clearTimeout(typingTimer);
      if (isTyping) {
        isTyping = false;
        socket.emit('typing', false);
      }
    }
    function handleTyping() {
      if (!joined) return;
      if (!isTyping) {
        isTyping = true;
        socket.emit('typing', true);
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(stopTyping, 2000);
    }
    input.addEventListener('input', () => {
      updateSend();
      handleTyping();
    });

    /* ---------- join flow ---------- */
    nameInput.value = load('nickname') || '';
    setTimeout(() => nameInput.focus(), 400);

    joinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      myName = nameInput.value.trim();
      store('nickname', myName);
      joined = true;
      socket.emit('join', myName);
      modal.classList.add('hidden');
      setInputEnabled(true);
      setTimeout(() => input.focus(), 300);
      renderStatus();
    });

    /* ---------- send ---------- */
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !joined) return;
      socket.emit('chat-message', text);
      stopTyping();
      input.value = '';
      updateSend();
      setEmoji(false);
      sendBtn.classList.remove('fly');
      void sendBtn.offsetWidth; // restart the animation
      sendBtn.classList.add('fly');
      setTimeout(() => sendBtn.classList.remove('fly'), 650);
      input.focus();
    });

    /* ---------- socket events ---------- */
    socket.on('connect', () => {
      if (joined) socket.emit('join', myName); // re-join after a reconnect
      renderStatus();
    });

    socket.on('disconnect', () => {
      typingUsers.clear();
      renderTyping();
      renderStatus();
    });

    socket.on('history', (list) => {
      messagesEl.innerHTML = '';
      lastSender = null;
      list.forEach((m) => addChatMessage(m, false));
      showEmptyIfNeeded();
      scrollToBottom(false);
    });

    socket.on('chat-message', (msg) => {
      const own = msg.senderSocketId === socket.id;
      const stick = isNearBottom() || own;
      typingUsers.delete(msg.senderSocketId);
      renderTyping();
      addChatMessage(msg, true);
      if (stick) scrollToBottom(true);
      else jumpBtn.classList.add('show');
    });

    socket.on('system-message', (msg) => {
      const stick = isNearBottom();
      addSystemMessage(msg.text);
      if (stick) scrollToBottom(true);
    });

    socket.on('online', (data) => {
      const changed = onlineCount !== null && onlineCount !== data.count;
      onlineCount = data.count;
      onlineNames = data.names;
      renderStatus();
      if (changed) {
        pill.classList.remove('bump');
        void pill.offsetWidth;
        pill.classList.add('bump');
      }
    });

    socket.on('typing', (data) => {
      if (data.isTyping) typingUsers.set(data.id, data.name);
      else typingUsers.delete(data.id);
      renderTyping();
    });

    socket.on('rate-limited', () => {
      limitNote.classList.add('show');
      clearTimeout(limitTimer);
      limitTimer = setTimeout(() => limitNote.classList.remove('show'), 2200);
    });

    updateSend();
    renderStatus();
  </script>
</body>
</html>
